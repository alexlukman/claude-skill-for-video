<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Inter';font-weight:500;src:url(fonts/inter-500-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:600;src:url(fonts/inter-600-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:700;src:url(fonts/inter-700-normal.woff2) format('woff2')}
@font-face{font-family:'JB';font-weight:500;src:url(fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b0c0e}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Inter',sans-serif;
  background:radial-gradient(ellipse 80% 55% at 42% 48%,#2a2d33 0%,#16181b 55%,#0a0b0d 100%)}
#c{position:absolute;left:0;top:0;width:1080px;height:1920px;display:block}
#hd{position:absolute;left:110px;top:250px;font:500 26px 'JB';letter-spacing:.16em;color:#7d828a}
#hd b{color:#e9e6e1;font-weight:500}
svg{position:absolute;left:0;top:0}
.lb{position:absolute;left:0;top:0;width:250px;opacity:0}
.lb .n{font:500 24px 'JB';color:var(--accent);letter-spacing:.06em}
.lb .t{margin-top:6px;font:600 31px/1.05 'Inter';color:#f3f1ed;letter-spacing:-.01em}
.lb .s{margin-top:8px;font:500 20px 'JB';color:#8b9098}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-fps="30" data-width="1080" data-height="1920">
<canvas id="c" width="1080" height="1920"></canvas>
<div id="hd"><b id="hdt"></b> / <span id="hds"></span></div>
<svg width="1080" height="1920" viewBox="0 0 1080 1920" id="leads"></svg>
<div id="labels"></div>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const SPEC = __SPEC__;
document.documentElement.style.setProperty('--accent', SPEC.accent);
document.getElementById('hdt').textContent = SPEC.title.toUpperCase();
document.getElementById('hds').textContent = SPEC.subtitle.toUpperCase();
window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
let built; window.__hf.buildReady.breakdown = new Promise((r) => { built = r; });
await Promise.all([document.fonts.load('700 230px Inter'), document.fonts.load('500 30px JB'), document.fonts.load('600 46px Inter'), document.fonts.load('500 40px Inter')]);
const W = 1080, H = 1920;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const inOut3 = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const out3 = (x) => 1 - Math.pow(1 - x, 3);

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, alpha: true });
renderer.setSize(W, H, false); renderer.setPixelRatio(1); renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = .75;
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-6, 12, 8); scene.add(key);
const rim = new THREE.DirectionalLight(0xffd9c2, 1.2); rim.position.set(8, 4, -6); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xdfe6ff, 0x1a1b1e, .45));
const camera = new THREE.PerspectiveCamera(26, W / H, .5, 200);
camera.setViewOffset(W, H, 150, 0, W, H);

// ------------------------------------------------------------ geometry helpers
const PW = 3.6, PL = 7.5, PR = .62;          // phone width, length, corner radius
function rrShape(w, l, r, hole) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -l / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.absarc(x + w - r, y + r, r, -Math.PI / 2, 0);
  s.lineTo(x + w, y + l - r); s.absarc(x + w - r, y + l - r, r, 0, Math.PI / 2);
  s.lineTo(x + r, y + l); s.absarc(x + r, y + l - r, r, Math.PI / 2, Math.PI);
  s.lineTo(x, y + r); s.absarc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
  if (hole) s.holes.push(hole);
  return s;
}
function rrPath(w, l, r, cx = 0, cy = 0) {
  const p = new THREE.Path(); const x = cx - w / 2, y = cy - l / 2;
  p.moveTo(x + r, y); p.lineTo(x + w - r, y); p.absarc(x + w - r, y + r, r, -Math.PI / 2, 0);
  p.lineTo(x + w, y + l - r); p.absarc(x + w - r, y + l - r, r, 0, Math.PI / 2);
  p.lineTo(x + r, y + l); p.absarc(x + r, y + l - r, r, Math.PI / 2, Math.PI);
  p.lineTo(x, y + r); p.absarc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
  return p;
}
function slab(w, l, r, t, mat, bevel = .025, hole) {
  const g = new THREE.ExtrudeGeometry(rrShape(w, l, r, hole), { depth: t, bevelEnabled: bevel > 0, bevelSize: bevel, bevelThickness: bevel * .8, bevelSegments: 4, curveSegments: 24 });
  g.rotateX(-Math.PI / 2);            // extrude upward (+y); shape y -> -z
  return new THREE.Mesh(g, mat);
}
function faceUV(mesh, w, l) {          // planar uv on top face so a texture spans the slab
  const g = mesh.geometry, p = g.attributes.position, uv = new Float32Array(p.count * 2);
  for (let i = 0; i < p.count; i++) { uv[i * 2] = p.getX(i) / w + .5; uv[i * 2 + 1] = -p.getZ(i) / l + .5; }
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
}
const tex = (cw, ch, draw) => { const c = document.createElement('canvas'); c.width = cw; c.height = ch; draw(c.getContext('2d'), cw, ch); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };

// ------------------------------------------------------------ parts (top layer first, each a group exploded along y)
const parts = [];
function part(y0, y1) { const g = new THREE.Group(); g.userData = { y0, y1 }; scene.add(g); parts.push(g); return g; }
const MT = {
  steel: new THREE.MeshStandardMaterial({ color: 0xb8bcc2, metalness: 1, roughness: .32 }),
  dark: new THREE.MeshStandardMaterial({ color: 0x16181b, metalness: .4, roughness: .35 }),
  ti: new THREE.MeshStandardMaterial({ color: 0xa9adb3, metalness: 1, roughness: .3 }),
  copper: new THREE.MeshStandardMaterial({ color: 0xb87f4e, metalness: .9, roughness: .4 }),
  gold: new THREE.MeshStandardMaterial({ color: 0xd6ae5c, metalness: 1, roughness: .35 }),
  screw: new THREE.MeshStandardMaterial({ color: 0x9aa0a8, metalness: 1, roughness: .35 }),
};
const box = (g, w, h, d, m, x, y, z) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); g.add(b); return b; };
const cyl = (g, r, h, m, x, y, z, seg = 40) => { const c = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg), m); c.position.set(x, y, z); g.add(c); return c; };
const screw = (g, x, y, z) => { cyl(g, .085, .05, MT.screw, x, y, z, 16); const s = box(g, .11, .012, .02, MT.dark, x, y + .027, z); s.rotation.y = ((x * 7 + z * 3) % 3); };
const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const LENS = [[-1.0, -3.15], [-1.0, -2.3], [-.2, -2.72]];           // the three rear-camera positions (x, z)

// 0 cover glass
const glass = part(.44, 9.0);
{
  const gm = new THREE.MeshPhysicalMaterial({ color: 0xdfe9f5, transparent: true, opacity: .15, roughness: .04, metalness: 0, clearcoat: 1, clearcoatRoughness: .03, depthWrite: false });
  glass.add(slab(PW - .04, PL - .04, PR - .02, .05, gm, .03));
  glass.add(new THREE.LineSegments(new THREE.EdgesGeometry(glass.children[0].geometry, 30), new THREE.LineBasicMaterial({ color: 0xcfd6de, transparent: true, opacity: .55 })));
}
// 1 OLED display (screen + black bezel + flex cable)
const disp = part(.38, 7.8);
{
  const scrT = tex(720, 1500, (x, w, h) => {
    const g = x.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#0d1230'); g.addColorStop(.55, '#3a2470'); g.addColorStop(1, '#ef7d4f'); x.fillStyle = g; x.fillRect(0, 0, w, h);
    const r = x.createRadialGradient(w * .7, h * .78, 10, w * .7, h * .78, w * .9); r.addColorStop(0, 'rgba(255,190,140,.55)'); r.addColorStop(1, 'rgba(255,190,140,0)');
    x.fillStyle = r; x.fillRect(0, 0, w, h);
    x.fillStyle = '#fff'; x.textAlign = 'center';
    x.font = '500 40px Inter'; x.globalAlpha = .85; x.fillText(SPEC.date, w / 2, 250); x.globalAlpha = 1;
    x.font = '700 230px Inter'; x.fillText(SPEC.time, w / 2, 470);
    x.fillStyle = '#000'; x.beginPath(); x.roundRect(w / 2 - 110, 40, 220, 64, 32); x.fill();
  });
  disp.add(slab(PW - .12, PL - .12, PR - .06, .05, new THREE.MeshStandardMaterial({ color: 0x050506, roughness: .25, metalness: .2 }), .01));
  const scr = slab(PW - .3, PL - .3, PR - .15, .01, new THREE.MeshStandardMaterial({ color: 0xffffff, map: scrT, emissive: 0xffffff, emissiveMap: scrT, emissiveIntensity: .9, roughness: .3 }), 0);
  faceUV(scr, PW - .3, PL - .3); scr.position.y = .055; disp.add(scr);
  box(disp, 1.5, .02, .55, new THREE.MeshStandardMaterial({ color: 0xc98f3d, roughness: .5, metalness: .4 }), 0, -.012, PL / 2 - .5);   // flex ribbon
}
// 2 mid plate (steel, battery window, screws)
const mid = part(.3, 6.6);
{
  mid.add(slab(PW - .16, PL - .16, PR - .08, .05, MT.steel, .015, rrPath(2.85, 3.55, .25, .18, -.95)));
  [[-1.5, -3.4], [1.5, -3.4], [-1.55, -1.6], [1.55, -1.6], [-1.55, 1.9], [1.55, 1.9], [-1.4, 3.3], [1.4, 3.3], [-.55, -.62], [.9, -.62]].forEach(([x, z]) => screw(mid, x, .06, z));
  for (let i = 0; i < 5; i++) box(mid, 1.9 - i * .15, .014, .05, MT.ti, .2, .056, -2.45 + i * .16);     // ribs
}
// 3 frame (titanium band, buttons, USB-C and speaker holes)
const frame = part(0, 5.4);
{
  frame.add(slab(PW + .06, PL + .06, PR + .03, .4, MT.ti, .04, rrPath(PW - .22, PL - .22, PR - .1)));
  const btn = (z, len) => box(frame, .08, .12, len, MT.ti, -PW / 2 - .07, .18, z);
  btn(-1.9, .45); btn(-1.25, .7); btn(-.45, .7);
  box(frame, .08, .12, 1.0, MT.ti, PW / 2 + .07, .18, -1.3);
  box(frame, .78, .15, .06, MT.dark, 0, .2, PL / 2 + .02);                                           // USB-C port
  for (const s of [-1, 1]) for (let i = 0; i < 5; i++) cyl(frame, .035, .06, MT.dark, s * (.8 + i * .17), .2, PL / 2 + .035, 12).rotation.x = Math.PI / 2;
}
// 4 camera module (plate, three lenses, flash, sensor)
const cammod = part(.07, 4.2);
{
  const plate = slab(2.0, 2.15, .3, .1, MT.dark, .02); plate.position.set(-.55, 0, -2.72); cammod.add(plate);
  LENS.forEach(([x, z], i) => {
    cyl(cammod, .36, .2, new THREE.MeshStandardMaterial({ color: 0x6d7178, metalness: .9, roughness: .3 }), x, .2, z);
    cyl(cammod, .27, .05, MT.steel, x, .31, z);
    cyl(cammod, .2, .03, new THREE.MeshPhysicalMaterial({ color: 0x05070a, roughness: .05, clearcoat: 1, iridescence: .8 }), x, .335, z);
    cyl(cammod, .08, .02, new THREE.MeshStandardMaterial({ color: 0x2a3a66, roughness: .1, metalness: .3 }), x + .05, .35, z - .05);
  });
  cyl(cammod, .1, .06, new THREE.MeshStandardMaterial({ color: 0xfff2c8, emissive: 0xffe3a0, emissiveIntensity: .35 }), .5, .15, -2.3);           // flash
  cyl(cammod, .06, .05, new THREE.MeshStandardMaterial({ color: 0x0a0a0c, roughness: .2 }), .5, .15, -3.0);                                     // microphone
  box(cammod, .5, .02, .9, new THREE.MeshStandardMaterial({ color: 0xc98f3d, roughness: .5, metalness: .4 }), -.55, .1, -1.4);                  // ribbon to the board
}
// 5 logic board (SoC, shields, connectors, 30 small parts, screws)
const board = part(.07, 3.0);
{
  const pcbT = tex(600, 480, (x, w, h) => {
    x.fillStyle = '#0f2a22'; x.fillRect(0, 0, w, h);
    x.strokeStyle = 'rgba(214,174,92,.55)'; x.lineWidth = 2;
    for (let i = 0; i < 26; i++) { const y = 20 + i * 17; x.beginPath(); x.moveTo(10, y); x.lineTo(150 + (i * 37) % 200, y); x.lineTo(180 + (i * 37) % 200, y + 14); x.lineTo(w - 20, y + 14); x.stroke(); }
    x.fillStyle = 'rgba(214,174,92,.8)'; for (let i = 0; i < 40; i++) x.fillRect(30 + (i * 53) % 540, 30 + (i * 97) % 420, 8, 8);
  });
  const pcb = slab(3.05, 2.55, .3, .06, new THREE.MeshStandardMaterial({ color: 0xffffff, map: pcbT, roughness: .6, metalness: .3 }), .015);
  faceUV(pcb, 3.05, 2.55); pcb.position.set(.05, 0, -2.25); board.add(pcb);
  const chipT = tex(256, 256, (x, w, h) => { x.fillStyle = '#16181b'; x.fillRect(0, 0, w, h); x.strokeStyle = '#3b3f46'; x.lineWidth = 6; x.strokeRect(14, 14, w - 28, h - 28); x.fillStyle = '#9ba0a8'; x.font = '500 34px JB'; x.fillText('A-SoC', 40, 120); x.fillText('3nm', 40, 170); });
  box(board, 1.05, .08, .95, MT.steel, .75, .11, -2.55);                                                // SoC shield
  box(board, .66, .05, .66, new THREE.MeshStandardMaterial({ map: chipT, metalness: .4, roughness: .35 }), .75, .165, -2.55);
  box(board, .55, .07, .4, MT.steel, -.55, .1, -1.55);                                                  // radio shield
  box(board, .7, .06, .3, MT.steel, .75, .1, -1.35);
  box(board, .5, .06, .45, MT.dark, .85, .1, -3.1);                                                     // memory
  box(board, .6, .07, .3, MT.gold, -1.1, .1, -1.35);                                                    // connector
  for (let i = 0; i < 30; i++) { const w = .06 + rnd() * .09; box(board, w, .04, w * 1.4, i % 3 ? MT.dark : MT.gold, -1.3 + rnd() * 2.7, .08, -3.4 + rnd() * 2.2).rotation.y = rnd() > .5 ? 0 : Math.PI / 2; }
  [[-1.3, -3.4], [1.4, -3.4], [-1.3, -1.1], [1.4, -1.1]].forEach(([x, z]) => screw(board, x, .06, z));
}
// 6 speaker + taptic engine (bottom of the phone)
const hap = part(.07, 2.1);
{
  box(hap, 1.45, .22, .62, new THREE.MeshStandardMaterial({ color: 0x8e939a, metalness: .9, roughness: .4 }), -.6, .11, 3.12);              // taptic engine
  box(hap, .9, .19, .6, MT.dark, .85, .095, 3.12);                                                                                      // speaker box
  for (let i = 0; i < 6; i++) cyl(hap, .05, .02, MT.steel, .6 + i * .11, .2, 3.12, 12);                                                  // speaker grille
  box(hap, .9, .02, .5, new THREE.MeshStandardMaterial({ color: 0xc98f3d, roughness: .5, metalness: .4 }), .1, .02, 2.72);              // charge-port flex
  [[-1.3, 3.1], [1.4, 3.1]].forEach(([x, z]) => screw(hap, x, .22, z));
}
// 7 battery
const batt = part(.07, 1.2);
{
  const batT = tex(520, 660, (x, w, h) => {
    const g = x.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#2a2d33'); g.addColorStop(1, '#1b1d21'); x.fillStyle = g; x.fillRect(0, 0, w, h);
    x.strokeStyle = 'rgba(255,255,255,.08)'; x.lineWidth = 3; x.strokeRect(24, 24, w - 48, h - 48);
    x.fillStyle = '#d9d6d0'; x.font = '600 46px Inter'; x.fillText('Li-ion', 60, 120);
    x.fillStyle = '#9ba0a8'; x.font = '500 30px JB'; x.fillText('3,582 mAh', 60, 172); x.fillText('13.9 Wh  3.88 V', 60, 214);
    x.fillStyle = SPEC.accent; x.fillRect(60, h - 110, 70, 8);
  });
  const bat = slab(2.7, 3.3, .28, .16, new THREE.MeshStandardMaterial({ color: 0xffffff, map: batT, roughness: .55, metalness: .2 }), .02); faceUV(bat, 2.7, 3.3); bat.position.set(.18, 0, .95); batt.add(bat);
  box(batt, 1.1, .02, .55, new THREE.MeshStandardMaterial({ color: 0xd9d6d0, roughness: .6 }), .18, .17, 2.75);                         // pull tab
  box(batt, .5, .03, .12, MT.gold, .18, .18, 2.62);                                                                                    // terminal
}
// 8 back glass (magnet ring, coil, camera bump with three windows)
const back = part(0, 0);
{
  back.add(slab(PW, PL, PR, .07, new THREE.MeshPhysicalMaterial({ color: 0x3b4250, roughness: .42, metalness: .15, clearcoat: .6, clearcoatRoughness: .5 })));
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.05, .07, 16, 96), MT.steel); ring.rotation.x = Math.PI / 2; ring.scale.z = .5; ring.position.set(0, .11, .6); back.add(ring);
  cyl(back, .78, .05, MT.copper, 0, .1, .6, 64);
  cyl(back, .3, .06, new THREE.MeshStandardMaterial({ color: 0x23262b, roughness: .6 }), 0, .105, .6, 48);
  const bump = slab(2.0, 2.15, .32, .06, new THREE.MeshPhysicalMaterial({ color: 0x4a5262, roughness: .3, metalness: .2, clearcoat: .8 }), .02); bump.position.set(-.55, .07, -2.72); back.add(bump);
  LENS.forEach(([x, z]) => { const t = new THREE.Mesh(new THREE.TorusGeometry(.4, .04, 12, 48), MT.steel); t.rotation.x = Math.PI / 2; t.position.set(x, .18, z); back.add(t); cyl(back, .36, .02, new THREE.MeshPhysicalMaterial({ color: 0x05070a, roughness: .05, clearcoat: 1 }), x, .165, z); });
}

// local bounding boxes of each part while everything is still at rest (used to place the label dots)
parts.forEach(p => { p.userData.box = new THREE.Box3().setFromObject(p); });
const phone = new THREE.Group();
parts.forEach(p => { scene.remove(p); phone.add(p); });
scene.add(phone);

// ------------------------------------------------------------ labels
const L = SPEC.labels.map((lb, i) => ['', lb[0], lb[1] || '', i]).filter(l => l[1]);
const LX = 700; let LY = L.map((_, i) => 380 + i * 118);
const leads = document.getElementById('leads'), lab = document.getElementById('labels');
const NS = 'http://www.w3.org/2000/svg';
const lineEls = [], dotEls = [], labEls = [];
L.forEach(([n, t, s], i) => {
  const ln = document.createElementNS(NS, 'polyline'); ln.setAttribute('fill', 'none'); ln.setAttribute('stroke', '#c9ccd1'); ln.setAttribute('stroke-width', '2'); ln.setAttribute('opacity', 0);
  const dt = document.createElementNS(NS, 'circle'); dt.setAttribute('r', 6); dt.setAttribute('fill', SPEC.accent); dt.setAttribute('opacity', 0);
  leads.appendChild(ln); leads.appendChild(dt); lineEls.push(ln); dotEls.push(dt);
  const d = document.createElement('div'); d.className = 'lb'; d.innerHTML = `<div class="n">${n}</div><div class="t">${t}</div><div class="s">${s}</div>`;
  d.style.transform = `translate(${LX + 22}px,${LY[i] - 34}px)`; lab.appendChild(d); labEls.push(d);
});
// Label dots follow each part's projected outline, so they stay on the part while the view turns.
const cv = new THREE.Vector3();
function anchorOf(p) {
  const b = p.userData.box; let lo = 1e9, hi = -1e9, sy = 0;
  for (const x of [b.min.x, b.max.x]) for (const y of [b.min.y, b.max.y]) for (const z of [b.min.z, b.max.z]) {
    cv.set(x, y, z); p.localToWorld(cv); cv.project(camera);
    const px = (cv.x + 1) / 2 * W; lo = Math.min(lo, px); hi = Math.max(hi, px); sy += (1 - cv.y) / 2 * H;
  }
  return [hi - (hi - lo) * .17, sy / 8];
}

// ------------------------------------------------------------ time: assemble, explode, then the view turns around the stack
const T_EX = .4, T_EXD = 1.3, T_LB = 1.7, T_O0 = 2.6, T_O1 = 8.4;
function renderAt(t) {
  parts.forEach((p, i) => {
    const e = inOut3(clamp((t - T_EX - i * .06) / T_EXD, 0, 1));
    p.position.y = p.userData.y0 + (p.userData.y1 - p.userData.y0) * e;
  });
  const ex = smooth(T_EX, T_EX + T_EXD + .6, t), orb = smooth(T_O0, T_O1, t);
  phone.rotation.y = THREE.MathUtils.degToRad(-34 + 10 * smooth(0, 2.6, t) + 84 * orb);      // the turn: about 94 degrees in total
  phone.rotation.x = THREE.MathUtils.degToRad(1.2 * Math.sin(t * 1.3));
  phone.position.y = .04 * Math.sin(t * 1.7);
  const look = new THREE.Vector3(0, .4 + 4.3 * ex, 0);
  const dist = 50 + 11 * ex - 5 * orb, el = THREE.MathUtils.degToRad(34 - 4 * ex + 8 * orb);
  camera.position.set(look.x + dist * Math.cos(el) * .22, look.y + dist * Math.sin(el), look.z + dist * Math.cos(el));
  camera.lookAt(look.x, look.y, look.z);
  camera.updateMatrixWorld(); phone.updateMatrixWorld(true);
  renderer.render(scene, camera);
  // leaders: dot on the part -> elbow -> label
  L.forEach(([n, tt, s, pi], i) => {
    const a = smooth(T_LB + i * .12, T_LB + i * .12 + .3, t);
    const [ax, ay] = anchorOf(parts[pi]);
    const ex2 = LX, ey = LY[i];
