<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;font-weight:500;src:url(fonts/inter-500-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/inter-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(fonts/inter-700-normal.woff2)}
@font-face{font-family:"Inter Tight";font-weight:800;src:url(fonts/inter-tight-latin-800-normal.woff2)}
@font-face{font-family:Poppins;font-weight:400;src:url(fonts/poppins-latin-400-normal.woff2)}
@font-face{font-family:"JetBrains Mono";font-weight:500;src:url(fonts/jetbrains-mono-latin-500-normal.woff2)}
html,body{margin:0;background:#000;width:1080px;height:1920px;overflow:hidden}canvas{display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="spec.js"></script>
<script src="lib.js"></script>
<script src="scene.js"></script>
<script>
// wrap the scene's renderAt with the optional post filter from the spec
if (SPEC.filter && window.renderAt) { const base = window.renderAt; window.renderAt = t => { base(t); postFilter(SPEC.filter, t); }; }
Promise.all(['500 10px Inter','700 10px Inter','800 10px "Inter Tight"','400 10px Poppins','500 10px "JetBrains Mono"'].map(f => document.fonts.load(f).catch(() => 0)))
  .then(() => { const q = new URLSearchParams(location.search); window.renderAt(+(q.get('t') ?? 0)); window.ready = true; });
</script>
</body></html>
